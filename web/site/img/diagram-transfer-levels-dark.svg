<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Transfer levels"><title>Transfer levels</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="4" result="b"/><feFlood flood-color="#000000" flood-opacity="0.45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.5" y="0.5" width="959" height="559" rx="24" fill="#0B1124" stroke="#2B3659"/><text x="40" y="54" font-size="24" fill="#EEF2FF" font-weight="800" letter-spacing="-0.4">Transfer levels</text><text x="40" y="80" font-size="15" fill="#9EA9C8" >Every change is rated by the pace it needs – you pick how tight you are willing to go.</text><rect x="40" y="104" width="880" height="214" rx="18" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><text x="64" y="136" font-size="15" fill="#EEF2FF" font-weight="700" >Example: a change at Alexanderplatz</text><rect x="64" y="152" width="35.6384" height="22" rx="7" fill="#EB7405" /><text x="81.8192" y="167.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" >S5</text><text x="107.638" y="168" font-size="14" fill="#EEF2FF" >arrives 12:11</text><rect x="765.702" y="152" width="35.6384" height="22" rx="7" fill="#224F86" /><text x="783.521" y="167.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" >U8</text><text x="896" y="168" font-size="14" fill="#EEF2FF" text-anchor="end" >departs 12:18</text><rect x="64" y="188" width="356.571" height="36" rx="9" fill="#5A6890" /><rect x="423.571" y="188" width="115.857" height="36" rx="6" fill="#3B476B" /><rect x="542.429" y="188" width="353.571" height="36" rx="9" fill="#AAB0BE" /><text x="242.286" y="211" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" >walk 3 min</text><text x="481.5" y="211" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" >+1</text><text x="719.214" y="211" font-size="14" fill="#0E1A3A" font-weight="700" text-anchor="middle" >3 min to spare</text><text x="301.714" y="246" font-size="13" fill="#9EA9C8" text-anchor="middle" >normal pace: walk measured on OSM + 1 min buffer</text><text x="717.714" y="246" font-size="13" fill="#EEF2FF" font-weight="700" text-anchor="middle" >2–4 min to spare → Normal</text><path d="M64 260H349.3" stroke="#FF6F66" stroke-width="3" stroke-linecap="round"/><path d="M349.3 254V266" stroke="#FF6F66" stroke-width="2"/><text x="359.257" y="265" font-size="13" fill="#FF6F66" font-weight="600" >brisk pace: walk ×0.8, no buffer – still works</text><path d="M64 278V284H896V278" fill="none" stroke="#9EA9C8" stroke-width="1.5"/><text x="480" y="304" font-size="13" fill="#9EA9C8" text-anchor="middle" >7 min from the live arrival to the live departure</text><text x="40" y="356" font-size="12" fill="#9EA9C8" font-weight="700" letter-spacing="1.2">THE FOUR LEVELS – BY WALKING PACE</text><rect x="40" y="370" width="214" height="46" rx="12" fill="#5BD68A" /><text x="58" y="399" font-size="17" fill="#0E1A3A" font-weight="800" >Relaxed</text><text x="238" y="399" font-size="12" fill="#0E1A3A" font-weight="600" text-anchor="end" fill-opacity="0.8">DE: Entspannt</text><text x="58" y="442" font-size="14" fill="#EEF2FF" font-weight="700" >5+ min to spare</text><text x="58" y="462" font-size="13" fill="#9EA9C8" >plenty of buffer, stroll</text><rect x="262" y="370" width="214" height="46" rx="12" fill="#AAB0BE" /><text x="280" y="399" font-size="17" fill="#0E1A3A" font-weight="800" >Normal</text><text x="280" y="442" font-size="14" fill="#EEF2FF" font-weight="700" >2–4 min to spare</text><text x="280" y="462" font-size="13" fill="#9EA9C8" >normal walking pace</text><rect x="484" y="370" width="214" height="46" rx="12" fill="#FF6F66" /><text x="502" y="399" font-size="17" fill="#0E1A3A" font-weight="800" >Tight</text><text x="682" y="399" font-size="12" fill="#0E1A3A" font-weight="600" text-anchor="end" fill-opacity="0.8">DE: Knapp</text><text x="502" y="442" font-size="14" fill="#EEF2FF" font-weight="700" >works at a brisk pace</text><text x="502" y="462" font-size="13" fill="#9EA9C8" >walk ×0.8, no buffer</text><rect x="706" y="370" width="214" height="46" rx="12" fill="#F07AC8" /><text x="724" y="399" font-size="17" fill="#0E1A3A" font-weight="800" >Sprint</text><text x="724" y="442" font-size="14" fill="#EEF2FF" font-weight="700" >only running or with luck</text><text x="724" y="462" font-size="13" fill="#9EA9C8" >and every 0–1 min change</text><path d="M361.0 356H377.0L369.0 367Z" fill="#EEF2FF"/><text x="383" y="358" font-size="12" fill="#EEF2FF" font-weight="700" >this change</text><rect x="40" y="498" width="161.394" height="32" rx="16" fill="#C8F16B" /><text x="120.697" y="518.68" font-size="13" fill="#0E1A3A" font-weight="700" text-anchor="middle" >Slower on the move</text><text x="215.394" y="519" font-size="14" fill="#EEF2FF" font-weight="600" >Luggage, pram or walking aid: every walk counts ×1.3, at every level.</text></svg>
