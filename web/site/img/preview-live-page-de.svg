lexanderplatz</text><text x="144" y="592" font-size="11" fill="#5A6684" font-weight="500" >12:04 – 12:11</text><g opacity="1"><rect x="102" y="608" width="34" height="22" rx="7" fill="#224F86" /><text x="119" y="623.32" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" >U8</text></g><text x="144" y="618" font-size="11" fill="#0E1A3A" font-weight="700" >Alexanderplatz → Hermannplatz</text><text x="144" y="632" font-size="11" fill="#5A6684" font-weight="500" >12:18 – 12:27</text><text x="144" y="644" font-size="11" fill="#1B4FD8" font-weight="600" >3 von 6 Halten · dann Hermannplatz</text></g></g><rect x="201" y="118" width="68" height="8" rx="4" fill="#0E1424" /><path d="M180 298L508 195" stroke="#5A6684" stroke-width="1.4"/><circle cx="180" cy="298" r="4" fill="#0E1A3A"/><text x="520" y="200" font-size="16" fill="#0E1A3A" font-weight="800" >Ankunft in Echtzeit</text><text x="520" y="220" font-size="14" fill="#5A6684" >grün pünktlich, gelb und rot bei Verspätung,</text><text x="520" y="240" font-size="14" fill="#5A6684" >mit Countdown und Fortschritt der Fahrt</text><path d="M266 434L508 355" stroke="#5A6684" stroke-width="1.4"/><circle cx="266" cy="434" r="4" fill="#0E1A3A"/><text x="520" y="360" font-size="16" fill="#0E1A3A" font-weight="800" >Das Fahrzeug auf der Karte</text><text x="520" y="380" font-size="14" fill="#5A6684" >aus den Echtzeiten an den Halten geschätzt –</text><text x="520" y="400" font-size="14" fill="#5A6684" >nicht die GPS-Position eines Handys</text><path d="M310 608L508 515" stroke="#5A6684" stroke-width="1.4"/><circle cx="310" cy="608" r="4" fill="#0E1A3A"/><text x="520" y="520" font-size="16" fill="#0E1A3A" font-weight="800" >Jede Etappe in einem Blatt</text><text x="520" y="540" font-size="14" fill="#5A6684" >die aktuelle offen, mit den restlichen Halten;</text><text x="520" y="560" font-size="14" fill="#5A6684" >Konfetti bei der Ankunft</text><text x="520" y="630" font-size="13" fill="#1B4FD8" font-weight="700" >Die Fahrt steckt im Link – ohne Konto, ohne eigenen Server.</text></svg>
