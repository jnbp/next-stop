<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Umstiegsstufen"><title>Umstiegsstufen</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="4" result="b"/><feFlood flood-color="#1B2A5A" flood-opacity="0.13"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.5" y="0.5" width="959" height="559" rx="24" fill="#F5F7FC" stroke="#DCE3F1"/><text x="40" y="54" font-size="24" fill="#0E1A3A" font-weight="800" letter-spacing="-0.4">Umstiegsstufen</text><text x="40" y="80" font-size="15" fill="#5A6684" >Jeder Umstieg wird nach dem Tempo bewertet, das er braucht – du wählst, wie knapp es sein darf.</text><rect x="40" y="104" width="880" height="214" rx="18" fill="#FFFFFF" stroke="#DCE3F1" filter="url(#sh)"/><text x="64" y="136" font-size="15" fill="#0E1A3A" font-weight="700" >Beispiel: ein Umstieg am Alexanderplatz</text><rect x="64" y="152" width="35.6384" height="22" rx="7" fill="#EB7405" /><text x="81.8192" y="167.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" >S5</text><text x="107.638" y="168" font-size="14" fill="#0E1A3A" >an 12:11</text><rect x="802.802" y="152" width="35.6384" height="22" rx="7" fill="#013F75" /><text x="820.621" y="167.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" >U8</text><text x="896" y="168" font-size="14" fill="#0E1A3A" text-anchor="end" >ab 12:18</text><rect x="64" y="188" width="356.571" height="36" rx="9" fill="#3D4A6B" /><rect x="423.571" y="188" width="115.857" height="36" rx="6" fill="#8C96B0" /><rect x="542.429" y="188" width="353.571" height="36" rx="9" fill="#454A57" /><text x="242.286" y="211" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" >3 Min. Fußweg</text><text x="481.5" y="211" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" >+1</text><text x="719.214" y="211" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" >3 Min. übrig</text><text x="301.714" y="246" font-size="13" fill="#5A6684" text-anchor="middle" >normales Tempo: Weg aus OSM + 1 Min. Puffer</text><text x="717.714" y="246" font-size="13" fill="#0E1A3A" font-weight="700" text-anchor="middle" >2–4 Min. übrig → Normal</text><path d="M64 260H349.3" stroke="#A3141F" stroke-width="3" stroke-linecap="round"/><path d="M349.3 254V266" stroke="#A3141F" stroke-width="2"/><text x="359.257" y="265" font-size="13" fill="#A3141F" font-weight="600" >zügig: Weg ×0,8, ohne Puffer – klappt noch</text><path d="M64 278V284H896V278" fill="none" stroke="#5A6684" stroke-width="1.5"/><text x="480" y="304" font-size="13" fill="#5A6684" text-anchor="middle" >7 Min. von der Echtzeit-Ankunft bis zur Echtzeit-Abfahrt</text><text x="40" y="356" font-size="12" fill="#5A6684" font-weight="700" letter-spacing="1.2">DIE VIER STUFEN – NACH GEHTEMPO</text><rect x="40" y="370" width="214" height="46" rx="12" fill="#1B6B3A" /><text x="58" y="399" font-size="17" fill="#FFFFFF" font-weight="800" >Relaxed</text><text x="58" y="442" font-size="14" fill="#0E1A3A" font-weight="700" >5+ Min. übrig</text><text x="58" y="462" font-size="13" fill="#5A6684" >viel Puffer, gemütlich gehen</text><rect x="262" y="370" width="214" height="46" rx="12" fill="#454A57" /><text x="280" y="399" font-size="17" fill="#FFFFFF" font-weight="800" >Normal</text><text x="280" y="442" font-size="14" fill="#0E1A3A" font-weight="700" >2–4 Min. übrig</text><text x="280" y="462" font-size="13" fill="#5A6684" >normales Gehtempo</text><rect x="484" y="370" width="214" height="46" rx="12" fill="#A3141F" /><text x="502" y="399" font-size="17" fill="#FFFFFF" font-weight="800" >Knapp</text><text x="502" y="442" font-size="14" fill="#0E1A3A" font-weight="700" >klappt zügig gehend</text><text x="502" y="462" font-size="13" fill="#5A6684" >Weg ×0,8, ohne Puffer</text><rect x="706" y="370" width="214" height="46" rx="12" fill="#7D0F4F" /><text x="724" y="399" font-size="17" fill="#FFFFFF" font-weight="800" >Sprint</text><text x="724" y="442" font-size="14" fill="#0E1A3A" font-weight="700" >nur rennend oder mit Glück</text><text x="724" y="462" font-size="13" fill="#5A6684" >und jeder Umstieg mit 0–1 Min.</text><path d="M361.0 356H377.0L369.0 367Z" fill="#0E1A3A"/><text x="383" y="358" font-size="12" fill="#0E1A3A" font-weight="700" >dieser Umstieg</text><rect x="40" y="498" width="178.206" height="32" rx="16" fill="#C8F16B" /><text x="129.103" y="518.68" font-size="13" fill="#0E1A3A" font-weight="700" text-anchor="middle" >Langsamer unterwegs</text><text x="232.206" y="519" font-size="14" fill="#0E1A3A" font-weight="600" >Gepäck, Kinderwagen oder Gehhilfe: jeder Fußweg zählt ×1,3, auf jeder Stufe.</text></svg>
