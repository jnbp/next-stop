<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="A marked stop hops on the map and its stop positions pop in"><title>A marked stop hops on the map and its stop positions pop in</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.sg{animation:hop 3.6s infinite}@keyframes hop{0%{transform:translate(150px,132px) scale(.72);opacity:0;animation-timing-function:cubic-bezier(.2,.7,.4,1)}2%{opacity:1}6.67%{transform:translate(150px,114px) scale(1.08);animation-timing-function:cubic-bezier(.5,0,1,.6)}12.78%{transform:translate(150px,132px) scale(1)}15.56%{transform:translate(150px,132px) scale(.95)}20%{transform:translate(150px,132px) scale(1.02)}25%,86%{transform:translate(150px,132px) scale(1);opacity:1}95%,100%{transform:translate(150px,132px) scale(1);opacity:0}}.nm{animation:nm 3.6s infinite}@keyframes nm{0%,11.67%{opacity:0}18.33%,86%{opacity:1}95%,100%{opacity:0}}.p0{animation:p0 3.6s infinite}@keyframes p0{0%,14.44%{transform:translate(80px,154px) scale(0);opacity:0}18.61%{transform:translate(80px,154px) scale(1.15);opacity:1}21.11%,86%{transform:translate(80px,154px) scale(1);opacity:1}95%,100%{transform:translate(80px,154px) scale(1);opacity:0}}.p1{animation:p1 3.6s infinite}@keyframes p1{0%,17.77%{transform:translate(230px,130px) scale(0);opacity:0}21.94%{transform:translate(230px,130px) scale(1.15);opacity:1}24.44%,86%{transform:translate(230px,130px) scale(1);opacity:1}95%,100%{transform:translate(230px,130px) scale(1);opacity:0}}.p2{animation:p2 3.6s infinite}@keyframes p2{0%,21.10%{transform:translate(156px,172px) scale(0);opacity:0}25.27%{transform:translate(156px,172px) scale(1.15);opacity:1}27.77%,86%{transform:translate(156px,172px) scale(1);opacity:1}95%,100%{transform:translate(156px,172px) scale(1);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="4" result="b"/><feFlood flood-color="#1B2A5A" flood-opacity="0.13"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.5" y="0.5" width="359" height="219" rx="22" fill="#F5F7FC" stroke="#DCE3F1"/><clipPath id="mc"><rect x="1" y="1" width="358" height="218" rx="21"/></clipPath><g clip-path="url(#mc)"><rect x="0" y="0" width="360" height="220" rx="0" fill="#EEF0F3" /><ellipse cx="300" cy="40" rx="70" ry="34" fill="#D3E5CC"/><path d="M-10 138L370 122" stroke="#FFFFFF" stroke-width="16"/><path d="M190 -10L170 230" stroke="#FFFFFF" stroke-width="12"/></g><g class="p0" transform="translate(80 154)"><circle r="11" fill="#1B4FD8" stroke="#FFFFFF" stroke-width="2.5"/><text y="4.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text></g><g class="p1" transform="translate(230 130)"><circle r="11" fill="#1B4FD8" stroke="#FFFFFF" stroke-width="2.5"/><text y="4.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text></g><g class="p2" transform="translate(156 172)"><circle r="11" fill="#1B4FD8" stroke="#FFFFFF" stroke-width="2.5"/><text y="4.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text></g><g class="sg" transform="translate(150 132)"><ellipse cx="0" cy="0" rx="9" ry="3" fill="#000000" fill-opacity=".18"/><path d="M0 0V-34" stroke="#5A6684" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-48" r="17" fill="#F0D722" stroke="#0A7A3E" stroke-width="3.5"/><text x="0" y="-41" font-size="20" font-weight="800" fill="#0A7A3E" text-anchor="middle">H</text></g><g class="nm"><rect x="174" y="66" width="112.535" height="28" rx="14" fill="#FFFFFF" filter="url(#sh)"/><text x="230.267" y="85" font-size="13" fill="#0E1A3A" font-weight="800" text-anchor="middle" >Hermannplatz</text></g><text x="20" y="204" font-size="12" fill="#5A6684" font-weight="600" 