<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
  <!-- Only the origin goes along with requests; the fragment with the trip never leaves the browser. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src https://v6.bvg.transport.rest https://api.transitous.org https://tiles.openfreemap.org; worker-src blob:; child-src blob:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Next Stop · Live</title>
  <link rel="preload" href="../shared/fonts/google_sans_flex_400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../shared/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-hidden="true"></div>
  <div class="panel" id="panel">
    <header class="topbar card" id="topbar">
      <div class="topbar-main">
        <h1 id="headline">…</h1>
        <div class="topbar-sub">
          <span id="eta" class="eta"><span id="eta-label" class="eta-label"></span> <span id="eta-time" class="eta-time"></span></span>
          <span id="live" class="live chip-live loading" aria-live="polite"><i class="pulse" aria-hidden="true"></i><span id="fresh"></span></span>
        </div>
      </div>
      <button id="follow" class="follow" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>
        <span id="follow-label" class="visually-hidden"></span>
      </button>
    </header>
    <section class="sheet" id="sheet">
      <button id="grabber" class="grabber" type="button"><i></i></button>
      <div class="sheet-body" id="sheet-body">
        <div class="hero" id="hero">
          <div class="hero-main">
            <span id="counter" class="counter"><span id="countdown" class="countdown"></span>
              <span id="check" class="check" hidden aria-hidden="true">
                <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><path d="M14 25l7 7 13-15"/></svg>
              </span>
            </span>
            <div class="hero-text">
              <p id="hero-title" class="hero-title"></p>
              <p class="hero-meta"><span id="hero-time" class="hero-time"></span><span id="eta-delay" class="delay"></span><span id="hero-plat" class="hero-plat"></span></p>
            </div>
          </div>
          <div class="progress" aria-hidden="true">
            <div id="progress-segs" class="progress-segs"></div>
            <div id="progress-fill" class="progress-fill"></div>
            <i id="progress-dot" class="progress-dot"></i>
          </div>
          <div class="progress-labels" aria-hidden="true"><span id="bar-start"></span><span id="bar-now"></span><span id="bar-end"></span></div>
        </div>
        <p id="state" class="state" aria-live="polite"></p>
        <ol id="timeline" class="timeline"></ol>
        <section class="cta card" id="cta">
          <p id="app-line" class="cta-line"></p>
          <div class="cta-actions">
            <a id="open-app" class="button primary" hidden></a>
            <a id="get-app" class="button store" href="https://play.google.com/store/apps/details?id=io.github.jnbp.nextstop" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span id="get-app-label"></span></a>
          </div>
        </section>
        <footer class="foot">
          <p id="disclaimer" class="foot-strong"></p>
          <p>Next Stop · <span id="src-label"></span>:
            <a href="https://www.bvg.de/" target="_blank" rel="noopener noreferrer">BVG</a>/<a href="https://www.vbb.de/" target="_blank" rel="noopener noreferrer">VBB</a>,
            <a href="https://transitous.org/sources/" target="_blank" rel="noopener noreferrer">Transitous</a> ·
            <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a>,
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a></p>
          <p><span id="oss-label">Open Source (GPL-3.0)</span> ·
            <a href="https://github.com/jnbp/next-stop" target="_blank" rel="noopener noreferrer" id="code-link">Quellcode auf GitHub</a> ·
            <a href="../shared/vendor/LICENSE-maplibre-gl.txt">MapLibre GL JS (BSD-3-Clause)</a></p>
          <p id="note"></p>
          <p><a href="../datenschutz/">Datenschutz</a> · <a href="../en/privacy/">Privacy</a></p>
        </footer>
      </div>
    </section>
  </div>
  <canvas id="confetti" class="confetti" hidden aria-hidden="true"></canvas>
  <script src="../shared/core.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
