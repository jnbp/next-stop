<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1B4FD8">
  <!-- Only the origin goes along with requests; the fragment with the trip never leaves the browser. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src https://v6.bvg.transport.rest https://api.transitous.org https://tiles.openfreemap.org; worker-src blob:; child-src blob:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Next Stop · Live</title>
  <link rel="preload" href="../shared/fonts/google_sans_flex_400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-hidden="true"></div>
  <div class="panel" id="panel">
    <header class="hero glass" id="hero">
      <div class="hero-top">
        <span class="brand">Next Stop</span>
        <span id="live" class="live loading" aria-live="polite"><i class="pulse" aria-hidden="true"></i><span id="fresh"></span></span>
      </div>
      <h1 id="headline">…</h1>
      <div class="eta-row">
        <div id="eta" class="eta">
          <span id="eta-label" class="eta-label"></span>
          <span id="eta-time" class="eta-time"></span>
          <span id="eta-delay" class="delay"></span>
        </div>
        <span id="countdown" class="countdown"></span>
        <span id="check" class="check" hidden aria-hidden="true">
          <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><path d="M14 25l7 7 13-15"/></svg>
        </span>
      </div>
      <div class="progress" aria-hidden="true">
        <div id="progress-fill" class="progress-fill"></div>
        <div id="progress-marks" class="progress-marks"></div>
      </div>
      <p id="state" class="state" aria-live="polite"></p>
    </header>
    <section class="sheet glass" id="sheet">
      <button id="follow" class="follow glass" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <span id="follow-label"></span>
      </button>
      <button id="grabber" class="grabber" type="button"><i></i></button>
      <div class="sheet-body">
        <ol id="timeline" class="timeline"></ol>
        <footer class="foot">
          <p id="disclaimer" class="foot-strong"></p>
          <p>Next Stop · <span id="src-label"></span>:
            <a href="https://www.bvg.de/" target="_blank" rel="noopener noreferrer">BVG</a>/<a href="https://www.vbb.de/" target="_blank" rel="noopener noreferrer">VBB</a>,
            <a href="https://transitous.org/sources/" target="_blank" rel="noopener noreferrer">Transitous</a> ·
            <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a>,
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a></p>
          <p><span id="oss-label">Open Source (GPL-3.0)</span> ·
            <a href="https://github.com/jnbp/next-stop" target="_blank" rel="noopener noreferrer" id="code-link">Quellcode auf GitHub</a></p>
          <p id="note"></p>
          <p><a href="../datenschutz/">Datenschutz</a> · <a href="../en/privacy/">Privacy</a></p>
        </footer>
      </div>
    </section>
  </div>
  <canvas id="confetti" class="confetti" hidden aria-hidden="true"></canvas>
  <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"
          integrity="sha384-nXMl9YiLoSG5KBPTFgvxVuIqQQcqIvo0bFrvoEaGJC6r7IibIzF1S36Zbf/sKBtL" crossorigin="anonymous"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
