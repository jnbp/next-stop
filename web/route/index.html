<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1B4FD8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#3D6AF2" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../site/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../site/apple-touch-icon.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="../site/apple-touch-icon.png">
  <!-- Only the origin goes along with requests; the fragment with the connection never leaves the browser. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src https://v6.bvg.transport.rest https://api.transitous.org https://tiles.openfreemap.org; worker-src blob:; child-src blob:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Next Stop · So kommst du hin</title>
  <link rel="preload" href="../shared/fonts/google_sans_flex_400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../shared/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-wrap" id="map-wrap"><div id="map" class="map" aria-hidden="true"></div></div>
  <main class="col" id="col">
    <header class="top" id="top">
      <div class="hero-top">
        <span class="brand" id="title">…</span>
        <span id="live" class="live chip-live loading" aria-live="polite"><i class="pulse" aria-hidden="true"></i><span id="fresh"></span></span>
      </div>
      <h1 id="dest" class="dest"></h1>
      <p id="origin" class="origin"></p>
      <div class="hero-row">
        <span id="duration" class="counter"></span>
        <div class="when">
          <span id="times" class="times"></span>
          <span class="when-sub"><span id="day" class="day"></span> · <span id="summary" class="summary"></span></span>
        </div>
      </div>
      <p class="lead"><span id="countdown" class="countdown"></span></p>
    </header>
    <div id="banner" class="banner card" role="status" hidden>
      <p id="banner-text"></p>
      <div id="banner-actions" class="actions"></div>
    </div>
    <ol id="steps" class="steps"></ol>
    <section id="later" class="later card">
      <h2 id="later-title"></h2>
      <p id="later-route" class="later-route"></p>
      <div id="later-actions" class="actions"></div>
    </section>
    <footer class="foot">
      <p id="disclaimer" class="foot-strong"></p>
      <p>Next Stop · <span id="src-label"></span>:
        <a href="https://www.bvg.de/" target="_blank" rel="noopener noreferrer">BVG</a>/<a href="https://www.vbb.de/" target="_blank" rel="noopener noreferrer">VBB</a>,
        <a href="https://transitous.org/sources/" target="_blank" rel="noopener noreferrer">Transitous</a> ·
        <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a>,
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a></p>
      <p><span id="oss-label">Open Source (GPL-3.0)</span> ·
        <a href="https://github.com/jnbp/next-stop" target="_blank" rel="noopener noreferrer" id="code-link">Quellcode auf GitHub</a> ·
            <a href="../shared/vendor/LICENSE-maplibre-gl.txt">MapLibre GL JS (BSD-3-Clause)</a></p>
      <p id="note"></p>
      <p><a href="../datenschutz/">Datenschutz</a> · <a href="../en/privacy/">Privacy</a></p>
    </footer>
    <div class="cta" id="cta">
      <a id="open-app" class="button primary" hidden></a>
      <a id="get-app" class="button store" href="https://play.google.com/store/apps/details?id=io.github.jnbp.nextstop" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span id="get-app-label"></span></a>
    </div>
  </main>
  <div id="demo-bar" class="demo-bar glass" hidden>
    <span id="demo-label"></span>
    <button id="demo-forward" class="button primary" type="button"></button>
  </div>
  <script src="../shared/core.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
