<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Trip companion"><title>Trip companion</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="4" result="b"/><feFlood flood-color="#1B2A5A" flood-opacity="0.13"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.5" y="0.5" width="999" height="499" rx="24" fill="#F5F7FC" stroke="#DCE3F1"/><text x="40" y="54" font-size="24" fill="#0E1A3A" font-weight="800" letter-spacing="-0.4">Trip companion</text><text x="40" y="80" font-size="15" fill="#5A6684" >The phone follows the trip with live times and hands each step to the watch.</text><rect x="64" y="104" width="236" height="372" rx="38" fill="#0E1424" filter="url(#sh)"/><rect x="73" y="113" width="218" height="354" rx="30" fill="#FFFFFF" /><rect x="152" y="122" width="60" height="7" rx="3.5" fill="#0E1424" /><text x="93" y="165" font-size="11" fill="#5A6684" font-weight="700" letter-spacing="1.2">NEXT STEP</text><rect x="93" y="179" width="35.6384" height="24" rx="7" fill="#224F86" /><text x="110.819" y="195.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" >U8</text><text x="136.638" y="196" font-size="13" fill="#0E1A3A" font-weight="600" >towards Hermannstr.</text><text x="93" y="245" font-size="36" fill="#0E1A3A" font-weight="800" letter-spacing="-1">in 4 min</text><text x="93" y="269" font-size="13" fill="#5A6684" >departs 12:18 · on time</text><rect x="87" y="287" width="190" height="62" rx="14" fill="#E6ECFE" /><path d="M105 301H123V313H99V307Q99 301 105 301Z" fill="#C8F16B"/><rect x="127" y="301" width="24" height="12" rx="3" fill="#DCE3F1" /><rect x="155" y="301" width="24" height="12" rx="3" fill="#DCE3F1" /><rect x="183" y="301" width="24" height="12" rx="3" fill="#DCE3F1" /><rect x="211" y="301" width="24" height="12" rx="3" fill="#DCE3F1" /><rect x="239" y="301" width="24" height="12" rx="3" fill="#DCE3F1" /><text x="99" y="337" font-size="13" fill="#1B4FD8" font-weight="700" >Board at the front</text><path d="M97 375V429" stroke="#224F86" stroke-width="5" stroke-linecap="round"/><circle cx="97" cy="379" r="5" fill="#FFFFFF" stroke="#224F86" stroke-width="3"/><text x="113" y="384" font-size="13" fill="#0E1A3A" font-weight="600" >Alexanderplatz</text><circle cx="97" cy="425" r="5" fill="#FFFFFF" stroke="#224F86" stroke-width="3"/><text x="113" y="430" font-size="13" fill="#0E1A3A" font-weight="600" >Hermannplatz</text><text x="113" y="406" font-size="12" fill="#5A6684" >6 stops</text><path d="M312 290H432" stroke="#5A6684" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><rect x="322.356" y="276" width="99.2888" height="28" rx="14" fill="#FFFFFF" stroke="#DCE3F1"/><text x="372" y="294.32" font-size="12" fill="#0E1A3A" font-weight="600" text-anchor="middle" >Data Layer</text><rect x="538" y="106" width="124" height="60" rx="16" fill="#1A2030" /><rect x="538" y="414" width="124" height="60" rx="16" fill="#1A2030" /><circle cx="600" cy="290" r="164" fill="#262D40" filter="url(#sh)"/><circle cx="600" cy="290" r="150" fill="#05070D"/><circle cx="600" cy="290" r="138" fill="none" stroke="#1E2436" stroke-width="9"/><path d="M600.0 152.0A138 138 0 0 1 681.1 401.6" fill="none" stroke="#2FA866" stroke-width="9" stroke-linecap="round"/><text x="600" y="228" font-size="15" fill="#9EA9C8" font-weight="600" text-anchor="middle" >12:14</text><text x="600" y="292" font-size="52" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="-1.5">4 min</text><rect x="582.181" y="308" width="35.6384" height="24" rx="7" fill="#224F86" /><text x="600" y="324.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" >U8</text><text x="600" y="352" font-size="13" fill="#C9D1E8" font-weight="600" text-anchor="middle" >Hermannstr.</text><path d="M551 368H570V379H545V374Q545 368 551 368Z" fill="#C8F16B"/><rect x="573" y="368" width="25" height="11" rx="3" fill="#2B3350" /><rect x="601" y="368" width="25" height="11" rx="3" fill="#2B3350" /><rect x="629" y="368" width="25" height="11" rx="3" fill="#2B3350" /><path d="M694.468 189.402L778 145" stroke="#5A6684" stroke-width="1.4"/><circle cx="694.468" cy="189.402" r="4" fill="#0E1A3A"/><text x="790" y="150" font-size="14" fill="#0E1A3A" font-weight="700" >Countdown ring</text><text x="790" y="168" font-size="13" fill="#5A6684" >drains over the last 10 min,</text><text x="790" y="186" font-size="13" fill="#5A6684" >amber in the final minute</text><path d="M558 374L778 281" stroke="#5A6684" stroke-width="1.4"/><circle cx="558" cy="374" r="4" fill="#0E1A3A"/><text x="790" y="286" font-size="14" fill="#0E1A3A" font-weight="700" >Where to board</text><text x="790" y="304" font-size="13" fill="#5A6684" >front car lit, from</text><text x="790" y="322" font-size="13" fill="#5A6684" >change-position data</text><path d="M664 408L778 405" stroke="#5A6684" stroke-width="1.4"/><circle cx="664" cy="408" r="4" fill="#0E1A3A"/><text x="790" y="410" font-size="14" fill="#0E1A3A" font-weight="700" >Get-off alert</text><text x="790" y="428" font-size="13" fill="#5A6684" >one stop before, with</text><text x="790" y="446" font-size="13" fill="#5A6684" >sound and haptics</text></svg>
