<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Privacy by design"><title>Privacy by design</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="4" result="b"/><feFlood flood-color="#000000" flood-opacity="0.45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.5" y="0.5" width="959" height="419" rx="24" fill="#0B1124" stroke="#2B3659"/><text x="40" y="54" font-size="24" fill="#EEF2FF" font-weight="800" letter-spacing="-0.4">Privacy by design</text><text x="40" y="80" font-size="15" fill="#9EA9C8" >A shared trip lives in the link fragment – browsers never send it to a server.</text><rect x="40" y="104" width="170" height="180" rx="18" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><g transform="translate(64 126) scale(0.6667) translate(-18 -18)"><rect x="18" y="18" width="72" height="72" rx="20" fill="#1B4FD8"/><g transform="translate(-3 0) translate(54 54) scale(0.82) translate(-54 -54)"><path d="M27,54H48" stroke="#FFF" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M41,42L53,54L41,66" stroke="#FFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="74" cy="54" r="14" fill="#C8F16B"/><circle cx="74" cy="54" r="5.9" fill="#1B4FD8"/></g></g><text x="64" y="202" font-size="17" fill="#EEF2FF" font-weight="800" >Next Stop</text><text x="64" y="224" font-size="13" fill="#9EA9C8" >Share → Live link</text><text x="64" y="244" font-size="13" fill="#9EA9C8" >the trip is packed</text><text x="64" y="262" font-size="13" fill="#9EA9C8" >into the link</text><path d="M212 143H234" stroke="#9EA9C8" stroke-width="2" stroke-linecap="round"/><path d="M233 138.8L240 143L233 147.2Z" fill="#9EA9C8"/><rect x="244" y="120" width="556" height="46" rx="14" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><path d="M540 123H786a11 11 0 0 1 11 11V152a11 11 0 0 1 -11 11H540Z" fill="#C8F16B"/><text x="260" y="149" font-size="14" fill="#EEF2FF" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">https://your-host.example/live/</text><text x="554" y="149" font-size="14" fill="#0E1A3A" font-weight="700" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#v=1&amp;d=eyJsZWdzIjpb…</text><text x="392" y="190" font-size="13" fill="#9EA9C8" text-anchor="middle" >path: only fetches the page</text><text x="670" y="190" font-size="13" fill="#8FA9FF" font-weight="700" text-anchor="middle" >fragment: the trip – never sent</text><rect x="282" y="236" width="200" height="92" rx="16" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><text x="300" y="266" font-size="16" fill="#EEF2FF" font-weight="800" >Static host</text><text x="300" y="290" font-size="13" fill="#9EA9C8" >serves web/live as is</text><text x="300" y="308" font-size="13" fill="#9EA9C8" >never sees the trip</text><rect x="562" y="236" width="200" height="92" rx="16" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><text x="580" y="266" font-size="16" fill="#EEF2FF" font-weight="800" >Viewer's browser</text><text x="580" y="290" font-size="13" fill="#9EA9C8" >reads the fragment,</text><text x="580" y="308" font-size="13" fill="#9EA9C8" >shows progress live</text><path d="M392 198V226" stroke="#9EA9C8" stroke-width="2" stroke-linecap="round"/><path d="M387.8 225L392 232L396.2 225Z" fill="#9EA9C8"/><path d="M670 198V226" stroke="#8FA9FF" stroke-width="2" stroke-linecap="round"/><path d="M665.8 225L670 232L674.2 225Z" fill="#8FA9FF"/><rect x="822" y="214" width="98" height="34" rx="10" fill="#1E2B57" /><text x="871" y="236" font-size="12" fill="#8FA9FF" font-weight="700" text-anchor="middle" >Transitous</text><path d="M764 282L813.6 235.1" stroke="#9EA9C8" stroke-width="1.6" stroke-linecap="round"/><path d="M816.5 238.2L818 231L810.8 232.1Z" fill="#9EA9C8"/><rect x="822" y="260" width="98" height="34" rx="10" fill="#1E2B57" /><text x="871" y="282" font-size="12" fill="#8FA9FF" font-weight="700" text-anchor="middle" >BVG REST</text><path d="M764 282L812.0 277.6" stroke="#9EA9C8" stroke-width="1.6" stroke-linecap="round"/><path d="M812.4 281.7L818 277L811.6 273.4Z" fill="#9EA9C8"/><rect x="822" y="306" width="98" height="34" rx="10" fill="#1E2B57" /><text x="871" y="328" font-size="12" fill="#8FA9FF" font-weight="700" text-anchor="middle" >OpenFreeMap</text><path d="M764 282L813.2 319.4" stroke="#9EA9C8" stroke-width="1.6" stroke-linecap="round"/><path d="M810.7 322.7L818 323L815.8 316.0Z" fill="#9EA9C8"/><text x="871" y="200" font-size="11" fill="#9EA9C8" font-weight="700" text-anchor="middle" letter-spacing="0.8">public APIs</text><rect x="40" y="352" width="103.38" height="34" rx="17" fill="#151E3B" stroke="#2B3659"/><text x="91.6902" y="373.68" font-size="13" fill="#EEF2FF" font-weight="600" text-anchor="middle" >No account</text><rect x="153.38" y="352" width="148.165" height="34" rx="17" fill="#151E3B" stroke="#2B3659"/><text x="227.463" y="373.68" font-size="13" fill="#EEF2FF" font-weight="600" text-anchor="middle" >No server of ours</text><rect x="311.546" y="352" width="156.433" height="34" rx="17" fill="#151E3B" stroke="#2B3659"/><text x="389.763" y="373.68" font-size="13" fill="#EEF2FF" font-weight="600" text-anchor="middle" >No analytics or ads</text><rect x="477.979" y="352" width="185.647" height="34" rx="17" fill="#151E3B" stroke="#2B3659"/><text x="570.803" y="373.68" font-size="13" fill="#EEF2FF" font-weight="600" text-anchor="middle" >Keys stay on the device</text></svg>
