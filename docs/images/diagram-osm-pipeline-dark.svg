<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="From OpenStreetMap to the app"><title>From OpenStreetMap to the app</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="4" result="b"/><feFlood flood-color="#000000" flood-opacity="0.45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.5" y="0.5" width="959" height="371" rx="24" fill="#0B1124" stroke="#2B3659"/><text x="40" y="54" font-size="24" fill="#EEF2FF" font-weight="800" letter-spacing="-0.4">From OpenStreetMap to the app</text><text x="40" y="80" font-size="15" fill="#9EA9C8" >One offline pipeline in tools/ turns Geofabrik extracts into the station data the app ships with.</text><rect x="40" y="108" width="160" height="200" rx="18" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><g transform="translate(58 126) scale(0.9167)"><rect width="48" height="48" rx="14" fill="#1B4FD8"/><g stroke-width="2.6"><path d="M11 16l8.5-3 9 3 8.5-3v19l-8.5 3-9-3-8.5 3z" fill="none" stroke="#FFFFFF"  stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 13v19M28.5 16v19" fill="none" stroke="#FFFFFF"  stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/><circle cx="24" cy="24" r="6.5" fill="#C8F16B" fill-opacity=".35"/><circle cx="24" cy="24" r="3.4" fill="#C8F16B"/></g></g><text x="58" y="200" font-size="17" fill="#EEF2FF" font-weight="800" >Geofabrik</text><text x="58" y="221" font-size="12" fill="#8FA9FF" font-weight="600" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">.osm.pbf</text><text x="58" y="248" font-size="13" fill="#9EA9C8" >per state or</text><text x="58" y="266" font-size="13" fill="#9EA9C8" >all of Germany</text><path d="M203 148H212" stroke="#9EA9C8" stroke-width="2" stroke-linecap="round"/><path d="M211 143.8L218 148L211 152.2Z" fill="#9EA9C8"/><rect x="220" y="108" width="160" height="200" rx="18" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><g transform="translate(238 126) scale(0.9167)"><rect width="48" height="48" rx="14" fill="#1B4FD8"/><g stroke-width="2.6"><path d="M11 35h7v-6h6v-6h6v-6h7" fill="none" stroke="#FFFFFF"  stroke-linecap="round" stroke-linejoin="round"/><path d="M33 33V25M30 27.5l3-3 3 3" fill="none" stroke="#C8F16B"  stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="238" y="200" font-size="17" fill="#EEF2FF" font-weight="800" >Extract</text><text x="238" y="221" font-size="12" fill="#8FA9FF" font-weight="600" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">extract_osm_pbf.py</text><text x="238" y="248" font-size="13" fill="#9EA9C8" >stations, platforms,</text><text x="238" y="266" font-size="13" fill="#9EA9C8" >footways, lifts</text><path d="M383 148H392" stroke="#9EA9C8" stroke-width="2" stroke-linecap="round"/><path d="M391 143.8L398 148L391 152.2Z" fill="#9EA9C8"/><rect x="400" y="108" width="160" height="200" rx="18" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><g transform="translate(418 126) scale(0.9167)"><rect width="48" height="48" rx="14" fill="#1B4FD8"/><g stroke-width="2.6"><path d="M14 34L24 23L34 14" fill="none" stroke="#FFFFFF"  stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 5.2" stroke-width="3"/><circle cx="14" cy="34" r="3" fill="#FFFFFF"/><circle cx="24" cy="23" r="3" fill="#FFFFFF"/><circle cx="34" cy="14" r="3.6" fill="#C8F16B"/></g></g><text x="418" y="200" font-size="17" fill="#EEF2FF" font-weight="800" >Build</text><text x="418" y="221" font-size="12" fill="#8FA9FF" font-weight="600" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">build_*.py</text><text x="418" y="248" font-size="13" fill="#9EA9C8" >entrances, stops,</text><text x="418" y="266" font-size="13" fill="#9EA9C8" >change positions,</text><text x="418" y="284" font-size="13" fill="#9EA9C8" >walk graph</text><path d="M563 148H572" stroke="#9EA9C8" stroke-width="2" stroke-linecap="round"/><path d="M571 143.8L578 148L571 152.2Z" fill="#9EA9C8"/><rect x="580" y="108" width="160" height="200" rx="18" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><rect x="580.5" y="108.5" width="159" height="199" rx="18" fill="none" stroke="#1B4FD8" stroke-width="2"/><g transform="translate(598 126) scale(0.9167)"><rect width="48" height="48" rx="14" fill="#1B4FD8"/><g stroke-width="2.6"><path d="M24 12l12 6-12 6-12-6z" fill="#C8F16B"/><path d="M12 24.5l12 6 12-6M12 30.5l12 6 12-6" fill="none" stroke="#FFFFFF"  stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="598" y="200" font-size="17" fill="#EEF2FF" font-weight="800" >State packs</text><text x="598" y="221" font-size="12" fill="#8FA9FF" font-weight="600" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">app assets</text><text x="598" y="248" font-size="13" fill="#9EA9C8" >all 16 states,</text><text x="598" y="266" font-size="13" fill="#9EA9C8" >one set each</text><path d="M743 148H752" stroke="#9EA9C8" stroke-width="2" stroke-linecap="round"/><path d="M751 143.8L758 148L751 152.2Z" fill="#9EA9C8"/><rect x="760" y="108" width="160" height="200" rx="18" fill="#151E3B" stroke="#2B3659" filter="url(#sh)"/><g transform="translate(778 126) scale(0.9167)"><rect width="48" height="48" rx="14" fill="#1B4FD8"/><g stroke-width="2.6"><rect x="12" y="28" width="4.6" height="7" rx="2" fill="#FFFFFF" fill-opacity=".55"/><rect x="18.8" y="24" width="4.6" height="11" rx="2" fill="#FFFFFF" fill-opacity=".75"/><rect x="25.6" y="19" width="4.6" height="16" rx="2" fill="#FFFFFF"/><rect x="32.4" y="13" width="4.6" height="22" rx="2" fill="#C8F16B"/></g></g><text x="778" y="200" font-size="17" fill="#EEF2FF" font-weight="800" >In the app</text><text x="778" y="221" font-size="12" fill="#8FA9FF" font-weight="600" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">transfer walks</text><text x="778" y="248" font-size="13" fill="#9EA9C8" >real walk minutes</text><text x="778" y="266" font-size="13" fill="#9EA9C8" >rate each change</text><text x="40" y="340" font-size="13" fill="#9EA9C8" >Stations · entrances · lifts · stop positions · line colours · change walks – all from © OpenStreetMap contributors (ODbL)</text></svg>
